name: Transfer pinned BGS source objects into COPY staging branch
on:
  push:
    branches:
      - sync/bgs-exact-mirror-20261113
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'zliu53468-ai/BGS-COPY.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Transfer original BGS Git objects without workflows or altering source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT=3b52be56191f1c4397e448455af36d05c63e12f5
          SOURCE_TREE=9ca5754286d1ce9dae902add77ff9f242ac5af26
          git fetch --no-tags --depth=1 https://github.com/zliu53468-ai/BGS0.3V.1.git "$SOURCE_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT^{tree}")" = "$SOURCE_TREE"
          git switch --orphan transfer-bgs-objects
          git read-tree --reset "$SOURCE_TREE"
          git rm --cached -r -q .github/workflows
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'transfer: pinned BGS source objects excluding workflow files'
          git push origin HEAD:refs/heads/transfer/bgs-source-objects-20261113
          echo "SOURCE_TREE=$SOURCE_TREE"
          echo "TRANSFER_TREE=$(git rev-parse HEAD^{tree})"
