name: BGS group text research safety and source parity
on:
  pull_request:
    branches: [main]
    paths:
      - runtime_app.py
      - line_group_webhook.py
      - test_line_group_webhook.py
      - group_text_research.py
      - group_reply_ui.py
      - test_group_reply_ui.py
      - group_image_scan.py
      - test_group_image_scan.py
      - test_group_text_research.py
      - GROUP_TEXT_RESEARCH.md
      - .github/workflows/group-text-research.yml
  push:
    branches: [main]
    paths:
      - runtime_app.py
      - line_group_webhook.py
      - test_line_group_webhook.py
      - group_text_research.py
      - group_reply_ui.py
      - test_group_reply_ui.py
      - group_image_scan.py
      - test_group_image_scan.py
      - test_group_text_research.py
      - GROUP_TEXT_RESEARCH.md
      - .github/workflows/group-text-research.yml
permissions:
  contents: read
jobs:
  group-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install BGS Soft Shoe bridge runtime
        run: python -m pip install "numpy>=1.26,<2.4" "opencv-python-headless>=4.8,<4.12" "nodejs-wheel==24.19.0" "fastapi==0.139.0" "httpx>=0.27,<0.30"
      - name: Syntax checks
        run: python -m py_compile group_reply_ui.py test_group_reply_ui.py group_text_research.py group_image_scan.py line_group_webhook.py test_group_text_research.py test_group_image_scan.py test_line_group_webhook.py app.py runtime_app.py bbb_soft_shoe_runtime.py
      - name: Fail-closed group and ledger regression tests
        run: python -m unittest -v test_group_reply_ui.py test_group_text_research.py test_line_group_webhook.py test_group_image_scan.py
      - name: Locked BBB Soft Shoe plus Road Aux regression
        run: python -m unittest -v test_bbb_soft_shoe_ocr.py
